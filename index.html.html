<title>Chicago Happy Hours 🍹</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #f59e0b;
    --accent2: #ec4899;
    --text: #f0f0f5;
    --muted: #888899;
    --green: #22c55e;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 700;
  }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }
  .search-wrap input {
    width: 100%;
    padding: 11px 16px 11px 40px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%);
    font-size: 1rem; pointer-events: none;
  }

  /* Day pills */
  .day-pills {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    flex-shrink: 0;
    padding: 7px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .day-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  select {
    flex-shrink: 0;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    max-width: 160px;
  }
  select:focus { border-color: var(--accent); }
  .toggle-btn {
    flex-shrink: 0;
    padding: 8px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.15s;
  }
  .toggle-btn.active {
    background: rgba(236,72,153,0.15);
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .clear-btn {
    flex-shrink: 0;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }

  /* Scrollable list */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 24px;
    -webkit-overflow-scrolling: touch;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
    active-state: opacity 0.8;
  }
  .card:active { opacity: 0.85; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-name {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.3;
  }
  .elizabeth-badge {
    flex-shrink: 0;
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    color: #000;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }
  .pill {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .pill.loc { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
  .pill.time { color: var(--accent); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); font-weight: 600; }
  .pill.cuisine { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.08); }
  .pill.outside { color: #60a5fa; border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.08); }
  .pill.oyster { color: #f472b6; border-color: rgba(244,114,182,0.3); background: rgba(244,114,182,0.08); }
  .pill.gf { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }

  .day-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .day-tag {
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .day-tag.today {
    background: rgba(245,158,11,0.12);
    border-color: rgba(245,158,11,0.4);
    color: var(--accent);
    font-weight: 700;
  }

  .deal {
    font-size: 0.88rem;
    line-height: 1.5;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 9px;
    border-left: 3px solid var(--accent);
    color: var(--text);
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .no-results .emoji { font-size: 3rem; margin-bottom: 12px; }
</style>

  const pills = [];
  if (r.location) pills.push(`<span class="pill loc">📍 ${r.location}</span>`);
  if (r.start && r.end) pills.push(`<span class="pill time">🕐 ${r.start} – ${r.end}</span>`);
  if (r.cuisine) pills.push(`<span class="pill cuisine">${r.cuisine}</span>`);
  if (r.outside_dining) pills.push(`<span class="pill outside">🌿 ${r.outside_dining}</span>`);
  if (r.oyster_deals) pills.push(`<span class="pill oyster">🦪 Oysters</span>`);
  if (r.gf_safe === true) pills.push(`<span class="pill gf">🌾 GF Safe</span>`);
  const eb = r.elizabeth_approved ? '<span class="elizabeth-badge">⭐ Pick</span>' : '';
  return `<div class="card">
    <div class="card-top"><span class="card-name">${r.name}</span>${eb}</div>
    <div class="card-row">${pills.join('')}</div>
    <div class="day-tags">${dayTags}</div>
    ${r.deal ? `<div class="deal">${r.deal}</div>` : ''}
  </div>`;
}

function render() {
  const filtered = DATA.filter(matches);
  document.getElementById('count').textContent = filtered.length + ' spots';
  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="no-results"><div class="emoji">🍺</div><p>No spots found — try adjusting your filters!</p></div>';
    return;
  }
  list.innerHTML = filtered.map(renderCard).join('');
}

document.getElementById('search').addEventListener('input', e => { filters.search = e.target.value; render(); });
document.getElementById('loc-sel').addEventListener('change', e => { filters.location = e.target.value; render(); });
document.getElementById('cuisine-sel').addEventListener('change', e => { filters.cuisine = e.target.value; render(); });

document.querySelectorAll('.day-pill').forEach(p => p.addEventListener('click', () => {
  const d = p.dataset.day;
  if (filters.days.includes(d)) { filters.days = filters.days.filter(x => x !== d); p.classList.remove('active'); }
  else { filters.days.push(d); p.classList.add('active'); }
  render();
}));

[['btn-outside','outside'],['btn-oyster','oyster'],['btn-gf','gf'],['btn-approved','approved']].forEach(([id,key]) => {
  document.getElementById(id).addEventListener('click', function() {
    filters[key] = !filters[key];
    this.classList.toggle('active', filters[key]);
    render();
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  filters = { search:'', location:'', cuisine:'', days:[], outside:false, oyster:false, gf:false, approved:false };
  document.getElementById('search').value = '';
  document.getElementById('loc-sel').value = '';
  document.getElementById('cuisine-sel').value = '';
  document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  render();
});

// Auto-select today
const todayPill = document.querySelector(`.day-pill[data-day="${today}"]`);
if (todayPill) { todayPill.click(); }
else { render(); }
</script>
</body>
</html>
